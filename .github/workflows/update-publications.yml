name: Update publications from SciX/ADS

on:
  schedule:
    - cron: "17 7 * * 1"     # every Monday 07:17 UTC (about 1-2 AM in Kansas)
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications from ADS
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/fetch_ads.py

      - name: Generate publication pages
        run: python scripts/bibtex_to_academicpages.py --write

      - name: Commit changes, if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliography/publications.bib _publications
          if git diff --cached --quiet; then
            echo "No changes in publications."
          else
            git commit -m "Weekly publication update from SciX/ADS"
            git push
          fi
